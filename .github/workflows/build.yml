on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-build-project:
    if: github.ref != 'refs/heads/main'
    uses: TedToolkit/TedToolkit/.github/workflows/legacy-build.yml@b45c29c681eecdec42d23c3324e474a78f1902d9

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Sign in to NuGet.org
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ArchiTed

      - name: Run Build Project
        env:
          NuGet__ApiKey: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          NuGet__Url: https://www.nuget.org
          NuGet__Source: https://api.nuget.org/v3/index.json
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run --project Build/Build.csproj

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: output/
          retention-days: 2
          if-no-files-found: ignore
